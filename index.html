```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .pantalla {
            text-align: center;
            color: white;
            z-index: 10;
        }

        .boton {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            border: 3px solid white;
            cursor: pointer;
            background: linear-gradient(135deg, #333, #111);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.05);
        }

        .mensaje {
            display: none;
            position: absolute;
            z-index: 20;
            color: white;
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            text-shadow: 0 3px 10px #000;
            animation: aparecer 2s ease forwards;
        }

        /* 🌼 FLORES AMARILLAS */
        .flor {
            position: absolute;
            top: -100px;
            font-size: 45px;
            animation: caer linear forwards;
            pointer-events: none;
        }

        @keyframes caer {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 1;
            }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fondo {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #fff4a3, #e8b923, #171717);
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
</head>

<body>

    <div class="fondo" id="fondo"></div>

    <div class="pantalla" id="inicio">
        <div class="boton" onclick="sorpresa()">
            🌼<br>
            Haz clic
        </div>
    </div>

    <div class="mensaje" id="mensaje">
        Para ti 💙<br>
        🌼🌼🌼
    </div>

    <script>

        function sorpresa() {

            // Ocultar el botón
            document.getElementById("inicio").style.display = "none";

            // Mostrar fondo
            document.getElementById("fondo").style.opacity = "1";

            // Mostrar mensaje
            document.getElementById("mensaje").style.display = "block";

            // Crear flores amarillas
            for (let i = 0; i < 80; i++) {

                const flor = document.createElement("div");

                flor.classList.add("flor");

                // 🌼 Flor amarilla
                flor.innerHTML = "🌼";

                // Posición horizontal aleatoria
                flor.style.left = Math.random() * 100 + "vw";

                // Tamaño aleatorio
                flor.style.fontSize =
                    (25 + Math.random() * 45) + "px";

                // Duración aleatoria
                flor.style.animationDuration =
                    (3 + Math.random() * 5) + "s";

                // Retraso aleatorio
                flor.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(flor);

                // Eliminar después de la animación
                setTimeout(() => {
                    flor.remove();
                }, 9000);
            }
        }

    </script>

</body>
</html>
